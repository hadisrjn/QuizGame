<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>بازی زیستگاه جانوران</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial ;
      background: radial-gradient(circle at top, #f5e9ff 0, #f5f7ff 40%, #f5f7ff 100%);
      color: #222;
      overflow: hidden; /* جلوگیری از اسکرول کل صفحه */
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .screen {
      width: 100%;
      max-width: 960px;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .screen.active {
      display: flex;
    }

    /* Start screen */

    .start-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      padding: 24px 20px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .start-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 20% 0, #ffdd80, #f14dff 40%, #7b5bff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 36px;
      box-shadow: 0 14px 30px rgba(111, 63, 247, 0.35);
      margin-bottom: 4px;
    }

    .start-title {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      margin: 0;
    }

    .start-text {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.8;
      margin: 0 0 6px;
    }

    #start-btn {
      padding: 10px 26px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(79, 70, 229, 0.4);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      margin-top: 4px;
    }

    #start-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(79, 70, 229, 0.5);
    }

    /* Game screen */

    .game-container {
      background: #ffffff;
      padding: 16px 14px 12px;
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .game-header {
      text-align: center;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .game-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 4px;
      border-radius: 50%;
      background: radial-gradient(circle at 20% 0, #ffdd80, #f14dff 40%, #7b5bff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 30px;
      box-shadow: 0 14px 30px rgba(111, 63, 247, 0.35);
    }

    h1 {
      font-size: 17px;
      margin: 0 0 4px;
      color: #111827;
      font-weight: 700;
    }

    #subtitle {
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 8px;
    }

    #score {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: stretch;
      flex-wrap: nowrap;
      margin-bottom: 8px;
    }

    .stat-card {
      flex: 1 1 0;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      background: #fbfbff;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stat-label {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 13px;
      font-weight: 700;
      color: #4c1d95;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-value .star {
      font-size: 14px;
      color: #fbbf24;
    }

    .progress-bar {
      position: relative;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #f3f4ff;
      overflow: hidden;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .progress-fill {
      position: absolute;
      inset: 0;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #020617;
      transition: width 0.18s ease-out;
    }

    #animal-image {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      margin-bottom: 8px;
      background: #eef2ff;
      flex-shrink: 0;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .option-btn {
      position: relative;
        padding: 12px 10px;
        border-radius: 14px;          /* rounded corners like before */
        border: 2px solid #d2d9e7;
        cursor: pointer;
        background: #f0f8ff;          /* white card */
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease,
          border-color 0.08s ease,
          background 0.08s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 70px;
        width: 100%;
    }

    .option-btn img.flag {
      width: 38px;
      height: auto;
      max-height: 28px;
      object-fit: contain;
    }

    .country-name {
      font-size: 14px;
      font-weight: 600;
      color: #333;
}

    .option-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.12);
      border-color: #c7d2fe;
      background: #f9fafb;
    }

    .option-btn.correct {
      background: #ecfdf3;
      border-color: #22c55e;
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.2), 0 8px 18px rgba(22, 163, 74, 0.2);
    }

    .option-btn.wrong {
      background: #fef2f2;
      border-color: #f97373;
      box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.2), 0 8px 18px rgba(248, 113, 113, 0.25);
    }

    .option-btn.correct::after,
    .option-btn.wrong::after {
      content: "";
      position: absolute;
      top: -8px;
      left: 10px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .option-btn.correct::after {
      content: "✓";
      background: #22c55e;
    }

    .option-btn.wrong::after {
      content: "✕";
      background: #ef4444;
    }

    #message {
      min-height: 0;
      font-size: 12px;
      margin: 0 0 6px;
      line-height: 1.6;
      text-align: center;
      padding: 0;
      border-radius: 14px;
      border: 1px solid transparent;
      display: none;
      flex-shrink: 0;
    }

    #message.visible {
      display: block;
      padding: 6px 8px;
    }

    #message.success {
      background: #ecfdf3;
      border-color: #22c55e;
      color: #166534;
    }

    #message.error {
      background: #fef2f2;
      border-color: #ef4444;
      color: #991b1b;
    }

    #next-btn {
      padding: 8px 18px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      min-width: 0;
      display: block;
      margin: 0 auto;
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.35);
      transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.08s ease;
      flex-shrink: 0;
    }

    #next-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(79, 70, 229, 0.45);
    }

    #next-btn:disabled {
      opacity: 0.4;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .end-message {
      margin: 10px 0 14px;
      font-size: 14px;
      line-height: 1.8;
      color: #374151;
      text-align: center;
    }

    #restart-btn {
      padding: 9px 20px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 22px rgba(79, 70, 229, 0.4);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      display: block;
      margin: 0 auto;
    }

    #restart-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(79, 70, 229, 0.5);
    }

    /* کمی بزرگ‌تر برای دسکتاپ، ولی همچنان بدون اسکرول */

    @media (min-width: 768px) {
      .game-container {
        max-width: 640px;
        padding: 18px 18px 14px;
      }

      .game-icon {
        width: 64px;
        height: 64px;
        font-size: 32px;
      }

      h1 {
        font-size: 19px;
      }

      #subtitle {
        font-size: 13px;
      }

      #animal-image {
        max-height: 190px;
      }

      .option-btn {
        min-height: 72px;
      }

      .stat-label {
        font-size: 12px;
      }

      .stat-value {
        font-size: 14px;
      }
    }

    /* اگر ارتفاع خیلی کم باشد، فاصله‌ها را باز هم کم کن */

    @media (max-height: 650px) {
      .game-container {
        padding: 10px 10px 8px;
        border-radius: 18px;
      }

      .game-icon {
        width: 48px;
        height: 48px;
        font-size: 26px;
      }

      h1 {
        font-size: 16px;
      }

      #subtitle {
        font-size: 11px;
      }

      #animal-image {
        max-height: 130px;
      }

      .options {
        gap: 4px;
      }

      .option-btn {
        min-height: 56px;
      }

      #message {
        font-size: 11px;
      }

      .end-message {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Start screen -->
    <div id="start-screen" class="screen active">
      <div class="start-card">
        <div class="start-icon">🏆</div>
        <h2 class="start-title">بازی زیستگاه جانوران</h2>
        <p class="start-text">
          این بازی یه تمرین برای یادگیری و شناخت زیستگاه جانوارن هست، دوست داری امتحانش کنی؟
        </p>
        <button id="start-btn">شروع بازی</button>
      </div>
    </div>

    <!-- Game screen -->
    <div id="game-screen" class="screen">
      <div class="game-container">
        <div class="game-header">
          <div class="game-icon">🏆</div>
          <h1>بازی زیستگاه جانوران</h1>
          <div id="subtitle">روی پرچم کشوری که این جانور بیشتر در آن زندگی می‌کند کلیک کن.</div>

          <div id="score">
            <div class="stat-card">
              <div class="stat-label">پیشرفت</div>
              <div class="stat-value"><span id="progress-text">۰٪</span></div>
            </div>
            <div class="stat-card">
              <div class="stat-label">سؤال</div>
              <div class="stat-value"><span id="question-text">۱ از ۱۵</span></div>
            </div>
            <div class="stat-card">
              <div class="stat-label">ستاره‌ها</div>
              <div class="stat-value">
                <span id="stars-text">۰ از ۳۰</span>
                <span class="star">★</span>
              </div>
            </div>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>

        <img id="animal-image" src="" alt="جانور" />

        <div class="options">
          <button class="option-btn"></button>
          <button class="option-btn"></button>
          <button class="option-btn"></button>
          <button class="option-btn"></button>
        </div>

        <div id="message"></div>
        <button id="next-btn" disabled>سؤال بعدی</button>
      </div>
    </div>
  </div>

  <script>
    const FLAGS = {
      iran:        { code: "ir", nameFa: "ایران" },
      australia:   { code: "au", nameFa: "استرالیا" },
      china:       { code: "cn", nameFa: "چین" },
      kenya:       { code: "ke", nameFa: "کنیا" },
      usa:         { code: "us", nameFa: "ایالات متحده آمریکا" },
      brazil:      { code: "br", nameFa: "برزیل" },
      india:       { code: "in", nameFa: "هند" },
      argentina:   { code: "ar", nameFa: "آرژانتین" },
      russia:      { code: "ru", nameFa: "روسیه" },
      germany:     { code: "de", nameFa: "آلمان" },
      japan:       { code: "jp", nameFa: "ژاپن" },
      france:      { code: "fr", nameFa: "فرانسه" },
      southAfrica: { code: "za", nameFa: "آفریقای جنوبی" },
      norway:      { code: "no", nameFa: "نروژ" },
      canada:      { code: "ca", nameFa: "کانادا" }
    };

    const animals = [
      {
        nameFa: "پلنگ ایرانی",
        image: "Images/Persian_Leopard_sitting.jpg",
        countryFa: "ایران",
        correctFlagKey: "iran",
        options: ["iran", "india", "russia", "germany"]
      },
      {
        nameFa: "بز کوهی",
        image: "Images/boz.jpeg",
        countryFa: "ایران (کوهستان‌های البرز و زاگرس)",
        correctFlagKey: "iran",
        options: ["iran", "india", "russia", "germany"]
      },
      {
        nameFa: "گوزن زرد ایرانی",
        image: "Images/Persian_fallow_deer.jpg",
        countryFa: "ایران",
        correctFlagKey: "iran",
        options: ["iran", "kenya", "norway", "china"]
      },
      {
        nameFa: "عقاب طلایی",
        image: "Images/Golden_eagle_in_flight.jpg",
        countryFa: "ایران و بعضی کشورهای کوهستانی",
        correctFlagKey: "iran",
        options: ["iran", "usa", "japan", "southAfrica"]
      },
      {
        nameFa: "تاس‌ماهی ایرانی",
        image: "Images/Acipenser_persicus.jpg",
        countryFa: "ایران (دریای خزر)",
        correctFlagKey: "iran",
        options: ["iran", "russia", "norway", "canada"]
      },
      {
        nameFa: "کانگورو",
        image: "Images/Kangaroo_Australia.jpeg",
        countryFa: "استرالیا",
        correctFlagKey: "australia",
        options: ["australia", "usa", "germany", "iran"]
      },
      {
        nameFa: "پاندای غول‌پیکر",
        image: "Images/Grosser_Panda.jpeg",
        countryFa: "چین",
        correctFlagKey: "china",
        options: ["china", "japan", "france", "canada"]
      },
      {
        nameFa: "شیر آفریقایی",
        image: "Images/Lion_waiting_in_Namibia.jpg",
        countryFa: "کنیا و دیگر کشورهای آفریقایی",
        correctFlagKey: "kenya",
        options: ["kenya", "southAfrica", "iran", "russia"]
      },
      {
        nameFa: "خرس قطبی",
        image: "Images/Polar_Bear_-_Alaska.jpg",
        countryFa: "کانادا و مناطق شمالگان",
        correctFlagKey: "canada",
        options: ["canada", "norway", "russia", "usa"]
      },
      {
        nameFa: "عقاب سرسفید",
        image: "Images/Bald_Eagle_in_Flight.jpeg",
        countryFa: "ایالات متحده آمریکا",
        correctFlagKey: "usa",
        options: ["usa", "canada", "brazil", "germany"]
      },
      {
        nameFa: "دلقک‌ماهی",
        image: "Images/Clownfish.jpeg",
        countryFa: "کنار سواحل استرالیا",
        correctFlagKey: "australia",
        options: ["australia", "japan", "india", "france"]
      },
      {
        nameFa: "پنگوئن امپراتور",
        image: "Images/pinguin.jpeg",
        countryFa: "نزدیک قارهٔ جنوبگان (مثلاً سواحل آرژانتین)",
        correctFlagKey: "argentina",
        options: ["argentina", "southAfrica", "norway", "australia"]
      },
      {
        nameFa: "مار کبری هندی",
        image: "Images/Indian_cobra.jpg",
        countryFa: "هند",
        correctFlagKey: "india",
        options: ["india", "china", "brazil", "iran"]
      },
      {
        nameFa: "توکان منقاررنگی",
        image: "Images/parrot.jpeg",
        countryFa: "جنگل‌های بارانی برزیل و آمریکای مرکزی",
        correctFlagKey: "brazil",
        options: ["brazil", "argentina", "france", "japan"]
      },
      {
        nameFa: "نهنگ آبی",
        image: "Images/whale.jpeg",
        countryFa: "اقیانوس‌های سرد نزدیک نروژ و شمال اروپا",
        correctFlagKey: "norway",
        options: ["norway", "canada", "australia", "russia"]
      }
    ];

    const imageEl = document.getElementById("animal-image");
    const optionButtons = Array.from(document.querySelectorAll(".option-btn"));
    const messageEl = document.getElementById("message");
    const nextBtn = document.getElementById("next-btn");

    const progressText = document.getElementById("progress-text");
    const questionText = document.getElementById("question-text");
    const starsText = document.getElementById("stars-text");
    const progressFill = document.getElementById("progress-fill");

    const startScreen = document.getElementById("start-screen");
    const gameScreen = document.getElementById("game-screen");
    const startBtn = document.getElementById("start-btn");

    let questionsOrder = [];
    let currentIndex = 0;
    let stars = 0;
    const maxStars = animals.length * 2; // ۳۰ ستاره
    let answered = false;

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function resetMessage() {
      messageEl.textContent = "";
      messageEl.className = "";
      messageEl.id = "message"; // keep id
      messageEl.style.display = "none";
    }

    function startGame() {
      questionsOrder = [...animals];
      shuffleArray(questionsOrder);
      currentIndex = 0;
      stars = 0;
      answered = false;
      resetMessage();
      nextBtn.textContent = "سؤال بعدی";
      nextBtn.disabled = true;
      loadQuestion();
      updateScore();
    }

    function loadQuestion() {
      answered = false;
      resetMessage();
      nextBtn.disabled = true;

      optionButtons.forEach(btn => {
        btn.classList.remove("correct", "wrong");
        btn.disabled = false;
      });

      const question = questionsOrder[currentIndex];

      imageEl.src = question.image;
      imageEl.alt = question.nameFa;

      const optionKeys = [...question.options];
      shuffleArray(optionKeys);

      optionButtons.forEach((btn, index) => {
        const key = optionKeys[index];
        const flagInfo = FLAGS[key];

        btn.dataset.flagKey = key;
btn.innerHTML = `
  <span class="option-content">
    <img class="flag" src="https://flagcdn.com/w40/${flagInfo.code}.png" alt="${flagInfo.nameFa}">
    <span class="country-name">${flagInfo.nameFa}</span>
  </span>
`;
      });

      updateScore();
    }

    function updateScore() {
      const totalQuestions = questionsOrder.length || animals.length;
      const currentQuestionNumber = currentIndex + 1;

      const progressPercent = Math.round((currentIndex / totalQuestions) * 100);

      progressText.textContent = `${progressPercent}٪`;
      questionText.textContent = `${currentQuestionNumber} از ${totalQuestions}`;
      starsText.textContent = `${stars} از ${maxStars}`;
      progressFill.style.width = `${Math.min(100, (currentIndex / totalQuestions) * 100)}%`;
    }

    function endGame() {
      const gameContainer = document.querySelector(".game-container");
      gameContainer.innerHTML = `
        <div class="game-header">
          <div class="game-icon">🏆</div>
          <h1>بازی زیستگاه جانوران</h1>
        </div>

        <div class="end-message">
          ${
            stars >= 12
              ? `آفرین! تو ${stars} ستاره گرفتی؛ دانش خیلی خوبی دربارهٔ زیستگاه جانوران داری.`
              : `آزمون تمام شد! تو ${stars} ستاره گرفتی.می‌خواهی دوباره امتحان بدهی؟`
          }
        </div>

        <button id="restart-btn">
          شروع دوباره
        </button>
      `;

      document.getElementById("restart-btn").addEventListener("click", () => {
        location.reload();
      });
    }

    function handleOptionClick(event) {
      if (answered) return;

      const selectedBtn = event.currentTarget;
      const selectedKey = selectedBtn.dataset.flagKey;
      const question = questionsOrder[currentIndex];
      const correctKey = question.correctFlagKey;
      const correctCountryFa = question.countryFa;

      answered = true;

      messageEl.style.display = "block";
      messageEl.classList.add("visible");

      if (selectedKey === correctKey) {
        stars += 2;
        selectedBtn.classList.add("correct");
        messageEl.classList.add("success");
        messageEl.textContent =
          `درست گفتی! ${question.nameFa} بیشتر در ${correctCountryFa} زندگی می‌کند.`;
      } else {
        selectedBtn.classList.add("wrong");
        messageEl.classList.add("error");
        messageEl.textContent =
          `اشتباه شد! ${question.nameFa} بیشتر در ${correctCountryFa} زندگی می‌کند.`;

        const correctBtn = optionButtons.find(
          btn => btn.dataset.flagKey === correctKey
        );
        if (correctBtn) {
          correctBtn.classList.add("correct");
        }
      }

      optionButtons.forEach(btn => {
        btn.disabled = true;
      });

      updateScore();

      if (currentIndex === questionsOrder.length - 1) {
        endGame();
      } else {
        nextBtn.disabled = false;
      }
    }

    optionButtons.forEach(btn => {
      btn.addEventListener("click", handleOptionClick);
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex >= questionsOrder.length) {
        startGame();
        return;
      }
      currentIndex++;
      loadQuestion();
    });

    // Start screen logic
    startBtn.addEventListener("click", () => {
      startScreen.classList.remove("active");
      gameScreen.classList.add("active");
      startGame();
    });
  </script>
</body>
</html>
